[project]
name = "ai-space-invader-template"
version = "0.4.0"
description = "Space Invaders for Agent training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-game-framework>=1.3.0",
    "numpy>=2.4.6",
    "websockets",
]
license = {text = "MIT"}
authors = [
    {name = "Mário Antunes", email = "mario.antunes@ua.pt"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.optional-dependencies]
ml = [
    "gymnasium",
    "stable-baselines3",
    "torch",
    "tensorboard",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "agents", "training"]

[tool.setuptools.package-data]
server = ["viewer/*"]

[tool.basedpyright]
typeCheckingMode = "standard"
failOnWarnings = false
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".git",
    "venv",
    "agents"
]

venvPath = "."
venv = "venv"
extraPaths = ["src"]

[tool.ruff]
line-length = 120
exclude = [
    "venv",
    ".venv",
    "agents"
]